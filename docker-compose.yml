
services:
  chunking-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-100}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-2}
      - MAX_FILES=${MAX_FILES:-10}
      - MAX_TOKENS=${MAX_TOKENS:-512}
      - OVERLAP=${OVERLAP:-100}
      - PRELOAD_MODELS=${PRELOAD_MODELS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REQUEST_TIMEOUT_SECONDS=${REQUEST_TIMEOUT_SECONDS:-1800}
      - CONCURRENCY_ACQUIRE_TIMEOUT=${CONCURRENCY_ACQUIRE_TIMEOUT:-180}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      # Embedding backend (set by setup.py)
      - EMBEDDING_MODE=${EMBEDDING_MODE:-local}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-auto}
      - MODEL_NAME=${MODEL_NAME:-}
      - TOKENIZER_ID=${TOKENIZER_ID:-}
      - EMBEDDING_API_BASE_URL=${EMBEDDING_API_BASE_URL:-https://openrouter.ai/api/v1}
      - EMBEDDING_API_MODEL=${EMBEDDING_API_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - CHUNKING_AUTH_TOKEN=${CHUNKING_AUTH_TOKEN:-}
    volumes:
      - model-cache:/home/appuser/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
volumes:
  model-cache:
